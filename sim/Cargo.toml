[package]
name = "lfd3k-sim"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Rev. J. Money <https://jmscnc.com>"]
publish = false
# Three bins (the demo, lfd3k-pcmodem and lfd3k-voicesim): plain `cargo run -p lfd3k-sim` runs the demo.
default-run = "lfd3k-sim"

[dependencies]
lfd3k-core = { path = "../core" }
# lfd3k-voicesim: two voice apps (the call engine, codecs, the scrambler) on the
# simulated channel. A normal dependency because a bin cannot use dev-dependencies.
lfd3k-voice = { path = "../voice" }
# lfd3k-pcmodem --raw: console raw mode and key events (MIT). Default features off:
# only key events and the Windows console, no bracketed paste or derive helpers.
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }

[dev-dependencies]
# Fuzz tests only (MIT OR Apache-2.0). Default features off: no fork/timeout crates.
proptest = { version = "1", default-features = false, features = ["std"] }
