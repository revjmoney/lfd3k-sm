[package]
name = "lfd3k-voice"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Rev. J. Money <https://jmscnc.com>"]
publish = false
description = "Shared voice engine for the LFD3K-SM apps: Opus and Codec2 codecs, jitter buffer, the FLOWTRON SCRAMBLER"

[dependencies]
lfd3k-core = { path = "../core" }
opus = "0.4"
# FLOWTRON SCRAMBLER (spec section 7): RustCrypto and dalek crates only.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
getrandom = "0.4"
hkdf = "0.13"
# Linking devices (spec 7.2): key confirm, and SPAKE2 keyed by the code.
# spake2 0.5 is a prerelease, pinned exactly; it is the release built on the
# same curve25519-dalek 5, sha2 0.11 and hkdf 0.13 as the rest of the crate.
hmac = { version = "0.13", features = ["zeroize"] }
spake2 = { version = "=0.5.0-pre.0", features = ["getrandom"] }
# zeroize: wipes hash and HMAC state (through digest), so HKDF state is wiped too.
sha2 = { version = "0.11", features = ["zeroize"] }
# Only the trait a fixed test-vector byte source implements
# (`Handshake::start_with_ephemeral_for_test_vectors`); the same version
# x25519-dalek already uses.
rand_core = { version = "0.10", default-features = false }
x25519-dalek = { version = "3", default-features = false, features = ["precomputed-tables", "getrandom", "zeroize"] }
zeroize = "1"
# Trust store file.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
