; LFD3K-SM firmware: ESP-IDF app that links the Rust core.
; Build the core first:  powershell -ExecutionPolicy Bypass -File build_core.ps1
; Then:                   pio run -d firmware -e heltec_v4          (multimode, the default)
;                         pio run -d firmware -e heltec_v4_single   (the modem alone on the board)
; Nothing here uploads; Rev flashes the V4 himself.

[platformio]
default_envs = heltec_v4

; Shared by both envs.
[env]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; The Rust static library is linked from src/CMakeLists.txt
; (target_link_libraries on the main component), which is the ESP-IDF way;
; plain build_flags do not reach the CMake link line.
; esptool 4.9 resets this board into download mode over native USB, and only a
; watchdog reset gets it back to the app. Rev passes the upload port himself.
platform_packages = platformio/tool-esptoolpy@2.40900.250804
board_upload.after_reset = watchdog_reset

; Multimode (default): the modem is one of four modes behind the picker
; (multimode/README.md). Its app lives in slot ota_1 (0x4A0000, 1.5 MB), so
; the size check uses that slot. Only firmware.bin is written, to 0x4A0000:
; this env's bootloader, partition table and otadata are NOT the multimode
; ones (the picker project builds the bootloader), so `-t upload` is refused.
; `-t erase` would wipe every mode on the board (bootloader, picker, all four
; slots and their data), so refuse_erase.py refuses it too.
[env:heltec_v4]
extra_scripts = post:refuse_erase.py
board_build.partitions = ../multimode/partitions-multimode.csv
board_build.app_partition_name = ota_1
upload_protocol = custom
upload_command = $PYTHONEXE -c "import sys; sys.exit('heltec_v4 is the multimode build. Do not upload it: write only firmware.bin to ota_1 at 0x4A0000 by hand (multimode/README.md), or use -e heltec_v4_single for the modem alone.')"

; The modem alone on the board, with the old single app table
; (firmware/partitions.csv: nvs, otadata, ota_0, ota_1, storage).
[env:heltec_v4_single]
board_build.partitions = partitions.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.single
