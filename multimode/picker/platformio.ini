; LFD3K-SM multimode picker: the factory app plus the bootloader override
; (bootloader_components/main) that starts it on every boot.
; Build:  pio run -d multimode/picker
; Nothing here uploads; flashing is done by hand, see multimode/README.md.

[platformio]
default_envs = picker

[env:picker]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = ../partitions-multimode.csv
platform_packages = platformio/tool-esptoolpy@2.40900.250804
board_upload.after_reset = watchdog_reset
